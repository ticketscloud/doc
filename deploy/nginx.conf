
server {
    listen 8080;
    server_name _;

    root /srv/src;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    charset utf-8;

    location = / {
        return 302 /ru/latest/;
    }

    location = /ru/latest {
        return 301 /ru/latest/;
    }

    location /ru/latest/ {
        try_files $uri $uri/ =404;
    }

    location ~* ^/ru/latest/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
